name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build site
        working-directory: web
        run: npm run build
        env:
          VITE_AEVUM_RPC_URL: ${{ vars.VITE_AEVUM_RPC_URL }}
          VITE_ESCROW_ADDRESS: ${{ vars.VITE_ESCROW_ADDRESS }}
          VITE_TUSD8_ADDRESS: ${{ vars.VITE_TUSD8_ADDRESS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
